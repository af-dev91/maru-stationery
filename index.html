<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maru Stationery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#FFF7EC;--ink:#2B2836;--muted:#6E6A7A;--coral:#F2663A;--coral-d:#D94F24;--sun:#FFC857;--mint:#2FB59B;--danger:#E0475B;--line:#EFE6D8;--shadow:0 10px 30px -12px rgba(43,40,54,.25)}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{font-family:'Baloo 2',cursive;margin:0;line-height:1.1}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;font-weight:700;transition:transform .15s,box-shadow .15s,background .15s}
button:hover{transform:translateY(-1px)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn{background:var(--coral);color:#fff;box-shadow:0 6px 14px -6px var(--coral)}
.btn:hover{background:var(--coral-d)}
.btn-ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:6px 10px;font-size:13px;border-radius:9px}
input,select,textarea{font:inherit;width:100%;padding:11px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--coral)}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
.field{margin-bottom:14px}
header.top{position:sticky;top:0;z-index:20;background:rgba(255,247,236,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:'Baloo 2';font-weight:800;font-size:22px;color:var(--ink);text-decoration:none}
.logo-mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--coral),var(--sun));display:grid;place-items:center;font-size:20px;box-shadow:var(--shadow)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
nav a{padding:8px 14px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600;font-size:15px}
nav a.active,nav a:hover{background:#fff;box-shadow:var(--shadow)}
.badge{background:var(--coral);color:#fff;border-radius:99px;font-size:12px;padding:1px 7px;margin-left:4px}
.who{font-size:13px;color:var(--muted);margin:0 6px}
main{flex:1;max-width:1180px;width:100%;margin:0 auto;padding:28px 20px 40px}
.hero{background:linear-gradient(120deg,var(--coral) 0%,#FF8A5B 45%,var(--sun) 100%);color:#fff;border-radius:24px;padding:34px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero h1{font-size:40px;max-width:600px}
.hero p{margin:12px 0 0;max-width:520px;opacity:.95}
.hero .deco{position:absolute;right:28px;bottom:-10px;font-size:120px;opacity:.92;transform:rotate(-12deg)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0 18px;align-items:center}
.toolbar input{max-width:320px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#fff;border:2px solid var(--line);border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.product{background:#fff;border-radius:20px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;transition:transform .2s}
.product:hover{transform:translateY(-4px)}
.thumb{height:120px;border-radius:14px;display:grid;place-items:center;font-size:58px;background:linear-gradient(135deg,#FFF1DE,#FFE3D1)}
.cat{font-size:12px;font-weight:700;color:var(--mint);text-transform:uppercase;letter-spacing:.06em}
.pname{font-weight:700;font-size:16px;line-height:1.3}
.price{font-family:'Baloo 2';font-weight:800;font-size:20px;color:var(--coral-d)}
.stock{font-size:13px;color:var(--muted)}
.product .btn{margin-top:auto;width:100%}
.card{background:#fff;border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.row{display:flex;gap:12px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.split{display:grid;grid-template-columns:1.6fr 1fr;gap:20px}
@media(max-width:820px){.split{grid-template-columns:1fr}.hero h1{font-size:30px}nav{margin-left:0}}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700}
.s-Diproses{background:#FFF0B8;color:#7A5A00}.s-Dikirim{background:#D9E9FF;color:#1D4E9B}.s-Selesai{background:#D2F5EC;color:#11705E}.s-Dibatalkan{background:#FFD9DE;color:#9B1D2F}
.line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.qty{display:inline-flex;align-items:center;gap:8px}
.qty button{padding:4px 11px;background:var(--cream);color:var(--ink)}
.total{font-family:'Baloo 2';font-size:26px;font-weight:800}
.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:22px}
.stat{background:#fff;border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.stat .n{font-family:'Baloo 2';font-size:30px;font-weight:800}
.stat .l{color:var(--muted);font-size:14px}
.stat .ic{font-size:26px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.tbl{overflow-x:auto}
.auth{max-width:440px;margin:30px auto}
.tabs{display:flex;background:#fff;border-radius:14px;padding:5px;margin-bottom:18px;box-shadow:var(--shadow)}
.tabs button{flex:1;background:transparent;color:var(--muted);padding:10px}
.tabs button.on{background:var(--ink);color:#fff}
.demo{background:#E9F8F4;border-radius:14px;padding:14px;font-size:14px;margin-top:16px;line-height:1.7}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.empty .big{font-size:56px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;box-shadow:var(--shadow);z-index:99;font-weight:600;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}}
footer.site{background:var(--ink);color:#EDE7F6;margin-top:auto}
footer.site .in{max-width:1180px;margin:auto;padding:26px 20px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:14px;align-items:center}
footer.site b{color:var(--sun)}
.sec-title{font-size:28px;margin-bottom:16px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-host"></div>

<script>
/* ============ Data & helper ============ */
const KEY = { users:'maru_users', products:'maru_products', orders:'maru_orders', session:'maru_session' };
const CATS = ['Alat Tulis','Buku & Kertas','Kantor','Seni & Gambar'];
const STATUSES = ['Diproses','Dikirim','Selesai','Dibatalkan'];

const SEED_USERS = [
  { id:'u-admin', name:'Admin Maru', email:'admin@marustationery.id', password:'admin123', role:'admin' },
  { id:'u-buyer', name:'Pembeli Demo', email:'pembeli@marustationery.id', password:'pembeli123', role:'pembeli' }
];
const SEED_PRODUCTS = [
  { id:'p1', name:'Pensil 2B (Lusin)', category:'Alat Tulis', price:24000, stock:60, icon:'✏️', desc:'Pensil kayu 2B untuk ujian dan catatan harian.' },
  { id:'p2', name:'Pulpen Gel Hitam 0.5 mm', category:'Alat Tulis', price:6500, stock:120, icon:'🖊️', desc:'Tinta lancar, goresan halus, tidak mudah belepotan.' },
  { id:'p3', name:'Penghapus Putih Kecil', category:'Alat Tulis', price:2000, stock:200, icon:'🧽', desc:'Tidak meninggalkan noda pada kertas HVS.' },
  { id:'p4', name:'Stabilo Highlighter Kuning', category:'Alat Tulis', price:8500, stock:4, icon:'🖍️', desc:'Warna cerah untuk menandai materi penting.' },
  { id:'p5', name:'Buku Tulis A5 58 Lembar', category:'Buku & Kertas', price:5000, stock:150, icon:'📓', desc:'Kertas putih bergaris dengan sampul yang kuat.' },
  { id:'p6', name:'Kertas HVS A4 70 gsm (1 Rim)', category:'Buku & Kertas', price:58000, stock:35, icon:'📄', desc:'500 lembar kertas putih untuk cetak dan fotokopi.' },
  { id:'p7', name:'Map Plastik Folio', category:'Buku & Kertas', price:3000, stock:90, icon:'🗂️', desc:'Melindungi dokumen dari lembap dan lipatan.' },
  { id:'p8', name:'Lem Kertas Stick 8 g', category:'Kantor', price:7000, stock:0, icon:'🧴', desc:'Lem stick bebas pelarut, aman untuk anak.' },
  { id:'p9', name:'Gunting Kantor 8 inci', category:'Kantor', price:15000, stock:25, icon:'✂️', desc:'Mata baja tajam dengan gagang yang nyaman.' },
  { id:'p10', name:'Penggaris Stainless 30 cm', category:'Kantor', price:12000, stock:40, icon:'📏', desc:'Skala jelas dan tepi yang tidak mudah melengkung.' },
  { id:'p11', name:'Spidol Whiteboard Hitam', category:'Kantor', price:11000, stock:55, icon:'🖋️', desc:'Tinta cepat kering dan mudah dihapus.' },
  { id:'p12', name:'Krayon 24 Warna', category:'Seni & Gambar', price:18000, stock:30, icon:'🎨', desc:'Warna cerah yang aman untuk anak-anak.' },
  { id:'p13', name:'Buku Sketsa A4', category:'Seni & Gambar', price:32000, stock:20, icon:'🖼️', desc:'Kertas tebal 120 gsm, cocok untuk pensil dan cat air.' }
];

const $ = (s, r = document) => r.querySelector(s);
const rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } };
const write = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const fmtDate = d => new Date(d).toLocaleString('id-ID', { dateStyle:'medium', timeStyle:'short' });

const users = () => read(KEY.users, []);
const products = () => read(KEY.products, []);
const orders = () => read(KEY.orders, []);
const me = () => { const e = read(KEY.session, null); return e ? users().find(u => u.email === e) || null : null; };
const cartKey = () => 'maru_cart_' + me().email;
const cart = () => read(cartKey(), {});
const setCart = c => write(cartKey(), c);
const cartCount = () => Object.values(cart()).reduce((a, b) => a + b, 0);

function init() {
  if (!localStorage.getItem(KEY.users)) write(KEY.users, SEED_USERS);
  if (!localStorage.getItem(KEY.products)) write(KEY.products, SEED_PRODUCTS);
  if (!localStorage.getItem(KEY.orders)) write(KEY.orders, []);
}

/* ============ State ============ */
const S = { route:'shop', q:'', cat:'Semua', mode:'login', editing:null };

/* ============ Layout ============ */
function nav(u) {
  const links = u.role === 'admin'
    ? [['a-dash','Dashboard'], ['a-products','Produk'], ['a-orders','Pesanan']]
    : [['shop','Katalog'], ['cart', 'Keranjang' + (cartCount() ? ` <span class="badge">${cartCount()}</span>` : '')], ['orders','Pesanan Saya']];
  return `<nav>${links.map(([r, l]) => `<a href="#" data-action="go" data-r="${r}" class="${S.route === r ? 'active' : ''}">${l}</a>`).join('')}
    <span class="who">Halo, ${esc(u.name.split(' ')[0])}</span>
    <button class="btn-ghost btn-sm" data-action="logout">Keluar</button></nav>`;
}
function header(u) {
  return `<header class="top"><div class="bar">
    <a class="logo" href="#" data-action="home"><span class="logo-mark">📒</span>Maru Stationery</a>
    ${u ? nav(u) : ''}</div></header>`;
}
function footer() {
  return `<footer class="site"><div class="in">
    <span>© ${new Date().getFullYear()} <b>Maru Stationery</b> · Semua hak dilindungi</span>
    <span>Dikembangkan oleh <b>Azzam Al Fayyadh - SMA Neg. 2 Kendari</b></span>
  </div></footer>`;
}

/* ============ Views: auth ============ */
function authView() {
  const login = S.mode === 'login';
  return `<div class="auth"><div class="card">
    <div class="tabs">
      <button class="${login ? 'on' : ''}" data-action="mode" data-m="login">Masuk</button>
      <button class="${!login ? 'on' : ''}" data-action="mode" data-m="register">Daftar Pembeli</button>
    </div>
    <h2 class="sec-title">${login ? 'Selamat datang kembali 👋' : 'Buat akun baru ✨'}</h2>
    <form data-form="${login ? 'login' : 'register'}">
      ${login ? '' : `<div class="field"><label>Nama lengkap</label><input name="name" required></div>`}
      <div class="field"><label>Email</label><input type="email" name="email" required></div>
      <div class="field"><label>Kata sandi</label><input type="password" name="password" required minlength="6"></div>
      <button class="btn" style="width:100%">${login ? 'Masuk' : 'Daftar'}</button>
    </form>
    ${login ? `<div class="demo"><b>Akun demo:</b><br>Admin: admin@marustationery.id / admin123<br>Pembeli: pembeli@marustationery.id / pembeli123</div>` : ''}
  </div></div>`;
}

/* ============ Views: buyer ============ */
function shopView() {
  return `<section class="hero">
      <h1>Perlengkapan tulismu, sekarang lebih mudah</h1>
      <p>Pensil, pulpen, buku, sampai kertas HVS. Pilih, tambahkan ke keranjang, lalu checkout dalam hitungan detik.</p>
      <div class="deco">✏️</div>
    </section>
    <div class="toolbar">
      <input type="search" placeholder="Cari produk…" value="${esc(S.q)}" data-input="q" style="flex:1;max-width:none">
      <div class="chips">${['Semua', ...CATS].map(c => `<button class="chip ${S.cat === c ? 'on' : ''}" data-action="cat" data-c="${esc(c)}">${c}</button>`).join('')}</div>
    </div>
    <div class="grid" id="grid"></div>`;
}
function gridHTML() {
  const q = S.q.trim().toLowerCase();
  const list = products().filter(p =>
    (S.cat === 'Semua' || p.category === S.cat) &&
    (!q || p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q)));
  if (!list.length) return `<div class="empty" style="grid-column:1/-1"><div class="big">🔍</div><p>Produk tidak ditemukan.</p></div>`;
  const c = cart();
  return list.map(p => {
    const inCart = c[p.id] || 0, out = p.stock <= 0;
    return `<article class="product">
      <div class="thumb">${esc(p.icon)}</div>
      <div class="cat">${esc(p.category)}</div>
      <div class="pname">${esc(p.name)}</div>
      <div class="muted" style="font-size:14px">${esc(p.desc)}</div>
      <div class="price">${rp(p.price)}</div>
      <div class="stock">${out ? 'Stok habis' : `Stok: ${p.stock}`}${inCart ? ` · ${inCart} di keranjang` : ''}</div>
      <button class="btn" data-action="add" data-id="${p.id}" ${out || inCart >= p.stock ? 'disabled' : ''}>${out ? 'Habis' : 'Tambah ke Keranjang'}</button>
    </article>`;
  }).join('');
}
function cartView() {
  const c = cart();
  const items = products().filter(p => c[p.id]);
  if (!items.length) return `<h2 class="sec-title">Keranjang Anda</h2><div class="card empty"><div class="big">🛒</div><p>Keranjang masih kosong.</p><button class="btn" data-action="go" data-r="shop">Belanja sekarang</button></div>`;
  let total = 0, count = 0;
  const rows = items.map(p => {
    const q = Math.min(c[p.id], p.stock), sub = q * p.price;
    total += sub; count += q;
    return `<div class="line">
      <div class="row"><div class="thumb" style="width:64px;height:64px;font-size:30px;border-radius:12px">${esc(p.icon)}</div>
        <div><div class="pname">${esc(p.name)}</div><div class="muted" style="font-size:14px">${rp(p.price)}</div></div></div>
      <div class="row">
        <div class="qty"><button data-action="qty" data-id="${p.id}" data-d="-1">−</button><b>${q}</b><button data-action="qty" data-id="${p.id}" data-d="1" ${q >= p.stock ? 'disabled' : ''}>+</button></div>
        <b style="min-width:110px;text-align:right">${rp(sub)}</b>
        <button class="btn-ghost btn-sm" data-action="rm" data-id="${p.id}">Hapus</button>
      </div></div>`;
  }).join('');
  return `<h2 class="sec-title">Keranjang Anda</h2>
    <div class="split"><div class="card">${rows}</div>
    <div class="card"><h3 style="margin-bottom:12px">Ringkasan</h3>
      <div class="between"><span class="muted">Total barang</span><b>${count}</b></div>
      <div class="between" style="margin:14px 0"><span>Total bayar</span><span class="total">${rp(total)}</span></div>
      <button class="btn" style="width:100%" data-action="go" data-r="checkout">Lanjut ke Checkout</button>
    </div></div>`;
}
function checkoutView() {
  const c = cart();
  const items = products().filter(p => c[p.id]);
  if (!items.length) return cartView();
  let total = 0;
  const lines = items.map(p => {
    const q = Math.min(c[p.id], p.stock); total += q * p.price;
    return `<div class="line"><span>${esc(p.name)} × ${q}</span><b>${rp(q * p.price)}</b></div>`;
  }).join('');
  const u = me();
  return `<h2 class="sec-title">Checkout</h2>
    <div class="split">
      <form class="card" data-form="checkout">
        <h3 style="margin-bottom:14px">Data pengiriman</h3>
        <div class="field"><label>Nama penerima</label><input name="name" required value="${esc(u.name)}"></div>
        <div class="field"><label>Nomor WhatsApp</label><input name="phone" required placeholder="08xxxxxxxxxx" pattern="[0-9+ ]{9,15}"></div>
        <div class="field"><label>Alamat lengkap</label><textarea name="address" rows="3" required></textarea></div>
        <div class="field"><label>Metode pembayaran</label>
          <select name="payment"><option>Transfer Bank</option><option>QRIS</option><option>Bayar di Tempat (COD)</option></select></div>
        <button class="btn" style="width:100%">Buat Pesanan • ${rp(total)}</button>
      </form>
      <div class="card"><h3 style="margin-bottom:8px">Pesanan Anda</h3>${lines}
        <div class="between" style="margin-top:14px"><span>Total</span><span class="total">${rp(total)}</span></div></div>
    </div>`;
}
function orderCard(o) {
  return `<div class="card" style="margin-bottom:16px">
    <div class="between"><div><b>${esc(o.id)}</b> <span class="muted" style="font-size:13px">· ${fmtDate(o.createdAt)}</span></div>
      <span class="pill s-${o.status}">${o.status}</span></div>
    <div style="margin:12px 0">${o.items.map(i => `<div class="line" style="padding:6px 0;border:0"><span>${esc(i.name)} × ${i.qty}</span><span>${rp(i.qty * i.price)}</span></div>`).join('')}</div>
    <div class="between"><span class="muted" style="font-size:14px">${esc(o.payment)} · ${esc(o.address)}</span>
      <b class="total" style="font-size:20px">${rp(o.total)}</b></div>
  </div>`;
}
function ordersView() {
  const mine = orders().filter(o => o.userEmail === me().email).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  if (!mine.length) return `<h2 class="sec-title">Pesanan Saya</h2><div class="card empty"><div class="big">📦</div><p>Belum ada pesanan.</p><button class="btn" data-action="go" data-r="shop">Mulai belanja</button></div>`;
  return `<h2 class="sec-title">Pesanan Saya</h2>${mine.map(orderCard).join('')}`;
}

/* ============ Views: admin ============ */
function dashView() {
  const P = products(), O = orders();
  const revenue = O.filter(o => o.status !== 'Dibatalkan').reduce((a, o) => a + o.total, 0);
  const stat = (ic, n, l) => `<div class="stat"><div class="ic">${ic}</div><div class="n">${n}</div><div class="l">${l}</div></div>`;
  const recent = [...O].sort((a, b) => b.createdAt.localeCompare(a.createdAt)).slice(0, 5);
  return `<h2 class="sec-title">Dashboard Admin</h2>
    <div class="stats">
      ${stat('📦', P.length, 'Jenis produk')}
      ${stat('🗃️', P.reduce((a, p) => a + p.stock, 0), 'Total stok (unit)')}
      ${stat('🧾', O.length, 'Total pesanan')}
      ${stat('⏳', O.filter(o => o.status === 'Diproses').length, 'Pesanan diproses')}
      ${stat('💰', rp(revenue), 'Pendapatan (tanpa batal)')}
    </div>
    <div class="card">
      <div class="between" style="margin-bottom:10px"><h3>Pesanan terbaru</h3>
        <button class="btn-ghost btn-sm" data-action="go" data-r="a-orders">Kelola pesanan</button></div>
      ${recent.length ? `<div class="tbl"><table>
          <tr><th>ID</th><th>Pembeli</th><th>Total</th><th>Status</th></tr>
          ${recent.map(o => `<tr><td>${esc(o.id)}</td><td>${esc(o.userName)}</td><td>${rp(o.total)}</td><td><span class="pill s-${o.status}">${o.status}</span></td></tr>`).join('')}
        </table></div>` : '<p class="muted">Belum ada pesanan.</p>'}
    </div>`;
}
function productsView() {
  const e = S.editing ? products().find(p => p.id === S.editing) : null;
  const rows = products().map(p => `<tr>
      <td><span style="font-size:24px">${esc(p.icon)}</span></td>
      <td><b>${esc(p.name)}</b><div class="muted" style="font-size:13px">${esc(p.category)}</div></td>
      <td>${rp(p.price)}</td><td>${p.stock}</td>
      <td style="white-space:nowrap"><button class="btn-ghost btn-sm" data-action="edit" data-id="${p.id}">Ubah</button>
        <button class="btn-danger btn-sm" data-action="del" data-id="${p.id}">Hapus</button></td></tr>`).join('');
  return `<h2 class="sec-title">Kelola Produk</h2>
    <div class="split">
      <div class="card"><h3 style="margin-bottom:12px">Daftar produk</h3>
        <div class="tbl"><table><tr><th></th><th>Produk</th><th>Harga</th><th>Stok</th><th></th></tr>${rows}</table></div></div>
      <form class="card" data-form="product">
        <h3 style="margin-bottom:12px">${e ? 'Ubah produk' : 'Tambah produk baru'}</h3>
        <input type="hidden" name="id" value="${e ? e.id : ''}">
        <div class="field"><label>Nama produk</label><input name="name" required value="${esc(e ? e.name : '')}"></div>
        <div class="field"><label>Kategori</label><select name="category">${CATS.map(c => `<option ${e && e.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
        <div class="field"><label>Deskripsi singkat</label><input name="desc" value="${esc(e ? e.desc : '')}"></div>
        <div class="row">
          <div class="field" style="flex:1"><label>Harga (Rp)</label><input type="number" name="price" min="0" required value="${e ? e.price : ''}"></div>
          <div class="field" style="flex:1"><label>Stok</label><input type="number" name="stock" min="0" required value="${e ? e.stock : ''}"></div>
        </div>
        <div class="field"><label>Ikon (emoji)</label><input name="icon" maxlength="4" value="${esc(e ? e.icon : '📝')}"></div>
        <div class="row">
          <button class="btn" style="flex:1">${e ? 'Simpan perubahan' : 'Tambah produk'}</button>
          ${e ? '<button type="button" class="btn-ghost" data-action="cancel-edit">Batal</button>' : ''}
        </div>
      </form>
    </div>`;
}
function adminOrdersView() {
  const O = [...orders()].sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  if (!O.length) return `<h2 class="sec-title">Kelola Pesanan</h2><div class="card empty"><div class="big">🧾</div><p>Belum ada pesanan masuk.</p></div>`;
  return `<h2 class="sec-title">Kelola Pesanan</h2>
    <div class="card tbl"><table>
      <tr><th>ID</th><th>Pembeli</th><th>Barang</th><th>Total</th><th>Status</th></tr>
      ${O.map(o => `<tr>
        <td><b>${esc(o.id)}</b><div class="muted" style="font-size:12px">${fmtDate(o.createdAt)}</div></td>
        <td>${esc(o.userName)}<div class="muted" style="font-size:13px">${esc(o.phone)}</div></td>
        <td style="font-size:13px">${o.items.map(i => `${esc(i.name)} × ${i.qty}`).join('<br>')}</td>
        <td>${rp(o.total)}</td>
        <td><select data-input="status" data-id="${o.id}" style="padding:7px;width:auto">
          ${STATUSES.map(s => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
      </tr>`).join('')}
    </table></div>`;
}

/* ============ Render ============ */
function render() {
  const u = me(), app = $('#app');
  if (!u) { app.innerHTML = header(null) + `<main>${authView()}</main>` + footer(); return; }
  const allowed = u.role === 'admin' ? ['a-dash','a-products','a-orders'] : ['shop','cart','checkout','orders'];
  if (!allowed.includes(S.route)) S.route = allowed[0];
  const views = { shop: shopView, cart: cartView, checkout: checkoutView, orders: ordersView,
                  'a-dash': dashView, 'a-products': productsView, 'a-orders': adminOrdersView };
  app.innerHTML = header(u) + `<main>${views[S.route]()}</main>` + footer();
  if (S.route === 'shop') $('#grid').innerHTML = gridHTML();
}

function toast(msg) {
  const h = $('#toast-host');
  h.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => h.innerHTML = '', 2600);
}

/* ============ Actions ============ */
const A = {
  go: el => { S.route = el.dataset.r; render(); window.scrollTo(0, 0); },
  home: () => { S.route = me()?.role === 'admin' ? 'a-dash' : 'shop'; render(); },
  mode: el => { S.mode = el.dataset.m; render(); },
  cat: el => { S.cat = el.dataset.c; render(); },
  add: el => {
    const p = products().find(x => x.id === el.dataset.id); if (!p) return;
    const c = cart();
    if ((c[p.id] || 0) >= p.stock) return toast('Stok tidak mencukupi');
    c[p.id] = (c[p.id] || 0) + 1; setCart(c);
    toast(`${p.name} ditambahkan ke keranjang`); render();
  },
  qty: el => {
    const id = el.dataset.id, d = +el.dataset.d, p = products().find(x => x.id === id), c = cart();
    c[id] = (c[id] || 0) + d;
    if (c[id] <= 0) delete c[id];
    if (p && c[id] > p.stock) { c[id] = p.stock; toast('Jumlah dibatasi stok'); }
    setCart(c); render();
  },
  rm: el => { const c = cart(); delete c[el.dataset.id]; setCart(c); render(); },
  logout: () => { localStorage.removeItem(KEY.session); S.route = 'shop'; render(); toast('Anda sudah keluar'); },
  edit: el => { S.editing = el.dataset.id; render(); },
  'cancel-edit': () => { S.editing = null; render(); },
  del: el => {
    if (!confirm('Hapus produk ini?')) return;
    write(KEY.products, products().filter(p => p.id !== el.dataset.id));
    toast('Produk dihapus'); render();
  }
};

/* ============ Forms ============ */
const F = {
  login(f) {
    const d = Object.fromEntries(new FormData(f));
    const u = users().find(x => x.email === d.email.trim().toLowerCase() && x.password === d.password);
    if (!u) return toast('Email atau kata sandi salah');
    write(KEY.session, u.email);
    S.route = u.role === 'admin' ? 'a-dash' : 'shop';
    toast(`Selamat datang, ${u.name}`); render();
  },
  register(f) {
    const d = Object.fromEntries(new FormData(f));
    const email = d.email.trim().toLowerCase();
    if (users().some(x => x.email === email)) return toast('Email sudah terdaftar');
    const list = users();
    list.push({ id: uid('u'), name: d.name.trim(), email, password: d.password, role: 'pembeli' });
    write(KEY.users, list); write(KEY.session, email);
    S.route = 'shop'; toast('Akun berhasil dibuat'); render();
  },
  checkout(f) {
    const u = me(), d = Object.fromEntries(new FormData(f));
    const c = cart(), ps = products(), items = [];
    let total = 0;
    for (const p of ps) {
      if (!c[p.id]) continue;
      const q = Math.min(c[p.id], p.stock);
      if (q <= 0) continue;
      items.push({ id: p.id, name: p.name, price: p.price, qty: q });
      total += q * p.price;
    }
    if (!items.length) return toast('Keranjang kosong');
    items.forEach(it => { const p = ps.find(x => x.id === it.id); p.stock -= it.qty; });
    write(KEY.products, ps);
    write(KEY.orders, [...orders(), {
      id: 'MR-' + Date.now().toString(36).toUpperCase(),
      userEmail: u.email, userName: d.name, phone: d.phone, address: d.address, payment: d.payment,
      items, total, status: 'Diproses', createdAt: new Date().toISOString()
    }]);
    setCart({});
    S.route = 'orders'; toast('Pesanan berhasil dibuat!'); render();
  },
  product(f) {
    const d = Object.fromEntries(new FormData(f));
    const ps = products();
    const data = {
      name: d.name.trim(), category: d.category, desc: d.desc.trim(),
      price: Math.max(0, +d.price), stock: Math.max(0, parseInt(d.stock, 10)),
      icon: d.icon.trim() || '📝'
    };
    if (d.id) {
      const i = ps.findIndex(p => p.id === d.id);
      if (i > -1) ps[i] = { ...ps[i], ...data };
      S.editing = null; toast('Produk diperbarui');
    } else {
      ps.push({ id: uid('p'), ...data }); toast('Produk ditambahkan');
    }
    write(KEY.products, ps); render();
  }
};

/* ============ Event wiring ============ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  if (el.tagName === 'A') e.preventDefault();
  if (el.disabled) return;
  A[el.dataset.action]?.(el, e);
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (!f.dataset.form) return;
  e.preventDefault();
  F[f.dataset.form]?.(f);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.input === 'q') {
    S.q = t.value;
    const g = $('#grid'); if (g) g.innerHTML = gridHTML();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.input !== 'status') return;
  const os = orders(), o = os.find(x => x.id === t.dataset.id);
  if (!o) return;
  const ns = t.value, ps = products();
  // kembalikan stok saat dibatalkan, ambil lagi bila pesanan dibuka kembali
  if (ns === 'Dibatalkan' && o.status !== 'Dibatalkan') {
    o.items.forEach(i => { const p = ps.find(x => x.id === i.id); if (p) p.stock += i.qty; });
    write(KEY.products, ps);
  } else if (o.status === 'Dibatalkan' && ns !== 'Dibatalkan') {
    o.items.forEach(i => { const p = ps.find(x => x.id === i.id); if (p) p.stock -= i.qty; });
    write(KEY.products, ps);
  }
  o.status = ns; write(KEY.orders, os);
  toast(`Status ${o.id} → ${ns}`); render();
});

init();
render();
</script>
